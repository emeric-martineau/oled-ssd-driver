[package]
name = "stm32-f1-ssd1332-example"
version = "0.1.0"
edition = "2021"

[dependencies]
oled-ssd-driver = { path = "../../.." }
stm32f1xx-hal = { version = "0.11", features = ["stm32f103", "rtic"] }
cortex-m = { version = "0.7", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7"
embedded-graphics = "0.8.1"
embedded-hal-bus = "0.3.0"
panic-halt = "1.0"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
