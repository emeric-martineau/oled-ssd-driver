[package]
name = "oled-ssd-driver"
version = "0.1.0"
edition = "2021"
description = "Platform-independent no_std driver for CH1115, CH1116, SSD0303, SSD1300, SSD1306, SSD1306B, SSD1307, SSD1309, SSD1312, SSD1315, SSD1320, SSD1325, SSD1327, SSD1331, SSD1332, SSD1351, SSD1362 OLED displays"
keywords = ["oled-screen-driver", "display"]
license = "MIT"

[dependencies]
embedded-graphics-core = "0.4"
embedded-hal = "1.0.0"
embedded-hal-async = "1.0.0"

[dev-dependencies]
embedded-hal-mock = { version = "0.11", default-features = false, features = ["embedded-hal-async"] }

[features]
default = []
async = []
