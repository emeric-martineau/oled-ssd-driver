[package]
name = "oled-ssd-driver"
version = "0.1.0"
edition = "2021"
description = "Platform-independent no_std driver for SSD1306 OLED displays"
license = "MIT"

[dependencies]
embedded-graphics-core = "0.4"
embedded-hal = "1.0.0"
embedded-hal-async = "1.0.0"

[dev-dependencies]
embedded-hal-mock = { version = "0.11", default-features = false, features = ["embedded-hal-async"] }

[features]
default = []
async = []
